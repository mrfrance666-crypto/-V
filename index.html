<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <title>CV Builder - Créez votre CV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        a, a:link, a:visited, a:hover, a:active {
            color: inherit !important;
            text-decoration: none !important;
        }
        body {
            background: #eef2f8;
            font-family: 'Inter', sans-serif;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: white;
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .lang-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: #f0f2f5;
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #1f4870;
            color: white;
        }
        .pdf-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f0f2f5;
            padding: 5px 15px;
            border-radius: 40px;
            flex-wrap: wrap;
        }
        .pdf-controls label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #1f4870;
        }
        .pdf-controls select {
            padding: 5px 8px;
            border-radius: 20px;
            border: 1px solid #cfdfed;
            background: white;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .pdf-controls .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pdf-controls .checkbox-group input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .btn-pdf, .btn-save, .btn-load {
            background: #1f4870;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-save { background: #2a6f6f; }
        .btn-load { background: #6c86a3; }
        .editor {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .editor-column {
            flex: 1;
            min-width: 240px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 4px;
            color: #2c3e4e;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1px solid #cfdfed;
            font-family: inherit;
            font-size: 0.85rem;
        }
        .array-item {
            background: #fafcff;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #e9f0f5;
        }
        .remove-item {
            background: none;
            border: none;
            color: #c0392b;
            float: right;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-add {
            background: #eff3f8;
            border: 1px dashed #8ba3bc;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 5px;
        }
        hr { margin: 16px 0; }

        .cv-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 16px;
        }
        .cv {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 16px;
            min-width: 700px;
            display: flex;
        }
        .cv-left {
            width: 240px;
            min-width: 240px;
            background: #fafcff;
            display: flex;
            flex-direction: column;
        }
        .cv-left-top {
            background: #f8fbfe;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .cv-photo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2a6f6f;
            background: #eef2f8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .cv-photo img { width: 100%; height: 100%; object-fit: cover; }
        .cv-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1f4870;
            text-align: center;
        }
        .cv-left-body { padding: 16px; }
        .cv-left-title {
            font-weight: 800;
            font-size: 0.7rem;
            color: #2a6f6f;
            border-bottom: 2px solid #2a6f6f;
            padding-bottom: 4px;
            margin: 14px 0 8px 0;
            text-transform: uppercase;
        }
        .cv-left-title:first-child { margin-top: 0; }
        .cv-contact {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.72rem;
            color: #2c3e4e;
            word-break: break-word;
        }
        .cv-contact i { width: 14px; color: #2a6f6f; font-size: 0.65rem; margin-top: 2px; }
        .cv-text { font-size: 0.72rem; line-height: 1.4; color: #2c3e4e; margin-bottom: 4px; }
        .cv-right { flex: 1; padding: 20px; }
        .cv-stage {
            background: #eef3fa;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 16px;
        }
        .cv-stage p { margin: 4px 0; }
        .cv-section-title {
            font-weight: 800;
            font-size: 0.85rem;
            color: #1f4a6e;
            border-left: 4px solid #2a6f6f;
            padding-left: 12px;
            margin: 0 0 10px 0;
        }
        .cv-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }
        .cv-skill {
            background: #e6f0f5;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 500;
        }
        .cv-job { margin-bottom: 12px; }
        .cv-job-title {
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .cv-job-date { font-weight: 400; color: #5f7d9c; font-size: 0.72rem; }
        .cv-job-desc { font-size: 0.72rem; color: #2c4a6e; margin-top: 3px; }
        .cv-edu { margin-bottom: 10px; }
        .cv-edu-title {
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .cv-edu-date { font-weight: 400; color: #5f7d9c; font-size: 0.72rem; }
        .cv-edu-place { font-size: 0.72rem; color: #4a627a; margin-top: 2px; }
        .cv-edu-desc { font-size: 0.68rem; color: #5f7d9c; margin-top: 2px; }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .lang-buttons { justify-content: center; }
            .pdf-controls { justify-content: center; }
            .btn-pdf, .btn-save, .btn-load { justify-content: center; }
            .editor { padding: 16px; }
        }
        @media (max-width: 480px) {
            .cv-photo { width: 70px; height: 70px; }
            .form-group input, .form-group textarea { font-size: 0.8rem; padding: 8px 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <div class="lang-buttons">
            <button class="lang-btn" data-lang="fr">Français</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="uk">Українська</button>
            <button class="lang-btn" data-lang="ru">Русский</button>
        </div>
        <div class="pdf-controls">
            <label id="actionLabel">📄 Действие:</label>
            <select id="pdfActionSelect">
                <option value="save" id="actionSave">Сохранить как PDF</option>
                <option value="preview" id="actionPreview">Предпросмотр</option>
            </select>
            <label id="orientationLabel">📄 Ориентация:</label>
            <select id="orientationSelect">
                <option value="portrait" id="orientationPortrait">Книжная</option>
                <option value="landscape" id="orientationLandscape">Альбомная</option>
                <option value="auto" id="orientationAuto">Авто</option>
            </select>
            <div class="checkbox-group">
                <input type="checkbox" id="hideDateCheckbox">
                <label id="hideDateLabel">Скрыть дату и время</label>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-save" id="saveProjectBtn"><i class="fas fa-save"></i> <span id="saveBtnText">Сохранить</span></button>
            <button class="btn-load" id="loadProjectBtn"><i class="fas fa-folder-open"></i> <span id="loadBtnText">Загрузить</span></button>
            <input type="file" id="loadFileInput" accept=".json" style="display: none;">
            <button class="btn-pdf" id="printPDFBtn"><i class="fas fa-print"></i> <span id="pdfBtnText">Готово</span></button>
        </div>
    </div>

    <div class="editor">
        <div class="editor-column">
            <div class="form-group"><label id="labelPhoto">📷 Photo</label><input type="file" id="photoUpload"></div>
            <div class="form-group"><label id="labelFullname">Nom complet</label><input type="text" id="fullname" placeholder="Ex: Sophie Martin"></div>
            <div class="form-group"><label id="labelPhone">Téléphone</label><input type="text" id="phone" placeholder="+33 6 12 34 56 78"></div>
            <div class="form-group"><label id="labelEmail">Email</label><input type="text" id="email" placeholder="nom@exemple.com"></div>
            <div class="form-group"><label id="labelAddress">Adresse</label><input type="text" id="address" placeholder="Paris, France"></div>
            <div class="form-group"><label id="labelLicense">Permis</label><input type="text" id="license" placeholder="Permis B"></div>
            <div class="form-group"><label id="labelWebsite">Site web</label><input type="text" id="website" placeholder="www.monsite.com"></div>
            <div><label><input type="checkbox" id="hideWebsite"> <span id="labelHideWebsite">Masquer le site</span></label></div>
            <div class="form-group"><label id="labelLanguages">Langues</label><input type="text" id="languages" placeholder="Anglais courant, Espagnol"></div>
            <div class="form-group"><label id="labelHobbies">Loisirs</label><input type="text" id="hobbies" placeholder="Sport, voyage"></div>
        </div>
        <div class="editor-column">
            <div class="form-group"><label id="labelStageTitle">Titre du stage</label><input type="text" id="stageTitle" placeholder="Recherche stage"></div>
            <div class="form-group"><label id="labelStageStart">Date début</label><input type="text" id="stageStart" placeholder="01/06/2025"></div>
            <div class="form-group"><label id="labelStageEnd">Date fin</label><input type="text" id="stageEnd" placeholder="31/08/2025"></div>
            <div class="form-group"><label id="labelStagePoste">Poste recherché</label><input type="text" id="stagePoste" placeholder="Stagiaire"></div>
            <div class="form-group"><label id="labelSkills">Compétences (virgules)</label><textarea id="skills" rows="3" placeholder="Compétence 1, Compétence 2"></textarea></div>
            <div class="form-group"><label id="labelExperiences">Expériences</label></div>
            <div id="expList"></div>
            <button class="btn-add" id="addExpBtn"><span id="addExpText">+ Ajouter expérience</span></button>
            <div class="form-group"><label id="labelEducations">Formations</label></div>
            <div id="eduList"></div>
            <button class="btn-add" id="addEduBtn"><span id="addEduText">+ Ajouter formation</span></button>
        </div>
    </div>

    <div class="cv-scroll-wrapper" id="cvPreviewWrapper">
        <div id="cvPreview"></div>
    </div>
</div>

<script>
    let experiences = [];
    let educations = [];
    let photoBase64 = "";
    let currentLang = "fr";

    const translations = {
        fr: { 
            labelPhoto:"📷 Photo", labelFullname:"Nom complet", labelPhone:"Téléphone", labelEmail:"Email", labelAddress:"Adresse", labelLicense:"Permis", labelWebsite:"Site web", labelHideWebsite:"Masquer le site",
            labelLanguages:"Langues", labelHobbies:"Loisirs", labelStageTitle:"Titre du stage", labelStageStart:"Date début", labelStageEnd:"Date fin", labelStagePoste:"Poste recherché",
            labelSkills:"Compétences (séparées par virgules)", labelExperiences:"Expériences", labelEducations:"Formations", addExpText:"+ Ajouter expérience", addEduText:"+ Ajouter formation",
            saveBtnText:"💾 Сохранить", loadBtnText:"📂 Загрузить", pdfBtnText:"Готово",
            contact:"Coordonnées", lang:"Langues", loisir:"Loisirs", comp:"COMPÉTENCES", exp:"EXPÉRIENCES PROFESSIONNELLES", edu:"FORMATIONS / DIPLÔMES",
            actionLabel:"📄 Action:", actionSave:"Enregistrer en PDF", actionPreview:"Aperçu",
            orientationLabel:"📄 Orientation:", orientationPortrait:"Portrait", orientationLandscape:"Paysage", orientationAuto:"Auto",
            hideDateLabel:"Masquer date et heure"
        },
        en: { 
            labelPhoto:"📷 Photo", labelFullname:"Full name", labelPhone:"Phone", labelEmail:"Email", labelAddress:"Address", labelLicense:"License", labelWebsite:"Website", labelHideWebsite:"Hide website",
            labelLanguages:"Languages", labelHobbies:"Hobbies", labelStageTitle:"Internship title", labelStageStart:"Start date", labelStageEnd:"End date", labelStagePoste:"Position sought",
            labelSkills:"Skills (comma separated)", labelExperiences:"Work experience", labelEducations:"Education", addExpText:"+ Add experience", addEduText:"+ Add education",
            saveBtnText:"💾 Save", loadBtnText:"📂 Load", pdfBtnText:"Done",
            contact:"Contact", lang:"Languages", loisir:"Hobbies", comp:"SKILLS", exp:"WORK EXPERIENCE", edu:"EDUCATION / DEGREES",
            actionLabel:"📄 Action:", actionSave:"Save as PDF", actionPreview:"Preview",
            orientationLabel:"📄 Orientation:", orientationPortrait:"Portrait", orientationLandscape:"Landscape", orientationAuto:"Auto",
            hideDateLabel:"Hide date and time"
        },
        uk: { 
            labelPhoto:"📷 Фото", labelFullname:"Повне ім'я", labelPhone:"Телефон", labelEmail:"Email", labelAddress:"Адреса", labelLicense:"Права", labelWebsite:"Сайт", labelHideWebsite:"Сховати сайт",
            labelLanguages:"Мови", labelHobbies:"Хобі", labelStageTitle:"Мета стажування", labelStageStart:"Дата початку", labelStageEnd:"Дата завершення", labelStagePoste:"Посада",
            labelSkills:"Навички (через кому)", labelExperiences:"Досвід роботи", labelEducations:"Освіта", addExpText:"+ Додати досвід", addEduText:"+ Додати освіту",
            saveBtnText:"💾 Зберегти", loadBtnText:"📂 Завантажити", pdfBtnText:"Готово",
            contact:"Контакти", lang:"Мови", loisir:"Хобі", comp:"НАВИЧКИ", exp:"ДОСВІД РОБОТИ", edu:"ОСВІТА / ДИПЛОМИ",
            actionLabel:"📄 Дія:", actionSave:"Зберегти як PDF", actionPreview:"Попередній перегляд",
            orientationLabel:"📄 Орієнтація:", orientationPortrait:"Портретна", orientationLandscape:"Альбомна", orientationAuto:"Авто",
            hideDateLabel:"Приховати дату і час"
        },
        ru: { 
            labelPhoto:"📷 Фото", labelFullname:"Полное имя", labelPhone:"Телефон", labelEmail:"Email", labelAddress:"Адрес", labelLicense:"Права", labelWebsite:"Сайт", labelHideWebsite:"Скрыть сайт",
            labelLanguages:"Языки", labelHobbies:"Хобби", labelStageTitle:"Цель стажировки", labelStageStart:"Дата начала", labelStageEnd:"Дата окончания", labelStagePoste:"Должность",
            labelSkills:"Навыки (через запятую)", labelExperiences:"Опыт работы", labelEducations:"Образование", addExpText:"+ Добавить опыт", addEduText:"+ Добавить образование",
            saveBtnText:"💾 Сохранить", loadBtnText:"📂 Загрузить", pdfBtnText:"Готово",
            contact:"Контакты", lang:"Языки", loisir:"Хобби", comp:"НАВЫКИ", exp:"ОПЫТ РАБОТЫ", edu:"ОБРАЗОВАНИЕ / ДИПЛОМЫ",
            actionLabel:"📄 Действие:", actionSave:"Сохранить как PDF", actionPreview:"Предпросмотр",
            orientationLabel:"📄 Ориентация:", orientationPortrait:"Книжная", orientationLandscape:"Альбомная", orientationAuto:"Авто",
            hideDateLabel:"Скрыть дату и время"
        }
    };

    function updateUILabels() {
        const t = translations[currentLang];
        if(!t) return;
        for(let id in t) {
            let el = document.getElementById(id);
            if(el && id !== 'labelExperiences' && id !== 'labelFormations') {
                if(id === 'labelPhoto') el.innerHTML = t[id];
                else el.innerText = t[id];
            }
        }
        // Обновляем выпадающие списки
        document.getElementById('actionSave').innerText = t.actionSave;
        document.getElementById('actionPreview').innerText = t.actionPreview;
        document.getElementById('orientationPortrait').innerText = t.orientationPortrait;
        document.getElementById('orientationLandscape').innerText = t.orientationLandscape;
        document.getElementById('orientationAuto').innerText = t.orientationAuto;
        
        document.getElementById('labelExperiences').innerText = t.labelExperiences;
        document.getElementById('labelEducations').innerText = t.labelEducations;
    }

    function renderPreview() {
        const t = translations[currentLang];
        const fullname = document.getElementById('fullname').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const address = document.getElementById('address').value;
        const license = document.getElementById('license').value;
        let website = document.getElementById('website').value;
        if(document.getElementById('hideWebsite').checked) website = "";
        const languages = document.getElementById('languages').value;
        const hobbies = document.getElementById('hobbies').value;
        const stageTitle = document.getElementById('stageTitle').value;
        const stageStart = document.getElementById('stageStart').value;
        const stageEnd = document.getElementById('stageEnd').value;
        const stagePoste = document.getElementById('stagePoste').value;
        const skillsRaw = document.getElementById('skills').value;
        const skills = skillsRaw.split(',').map(s=>s.trim()).filter(s=>s);

        let html = `<div class="cv" id="cvForPrint">`;
        html += `<div class="cv-left">`;
        html += `<div class="cv-left-top">`;
        if(photoBase64) html += `<div class="cv-photo"><img src="${photoBase64}"></div>`;
        else html += `<div class="cv-photo">📷</div>`;
        html += `<div class="cv-name">${escapeHtml(fullname) || "Votre nom"}</div>`;
        html += `</div>`;
        html += `<div class="cv-left-body">`;
        html += `<div class="cv-left-title">${t.contact}</div>`;
        if(phone)   html += `<div class="cv-contact"><i class="fas fa-phone-alt"></i>${escapeHtml(phone)}</div>`;
        if(email)   html += `<div class="cv-contact"><i class="fas fa-envelope"></i>${escapeHtml(email)}</div>`;
        if(address) html += `<div class="cv-contact"><i class="fas fa-map-marker-alt"></i>${escapeHtml(address)}</div>`;
        if(license) html += `<div class="cv-contact"><i class="fas fa-car"></i>${escapeHtml(license)}</div>`;
        if(website) html += `<div class="cv-contact"><i class="fas fa-globe"></i>${escapeHtml(website)}</div>`;
        if(languages) {
            html += `<div class="cv-left-title">${t.lang}</div>`;
            html += `<div class="cv-text">${escapeHtml(languages)}</div>`;
        }
        if(hobbies) {
            html += `<div class="cv-left-title">${t.loisir}</div>`;
            html += `<div class="cv-text">${escapeHtml(hobbies)}</div>`;
        }
        html += `</div></div>`;

        html += `<div class="cv-right">`;
        html += `<div class="cv-stage"><strong>${escapeHtml(stageTitle) || "Objectif stage"}</strong><p>Du ${escapeHtml(stageStart)} au ${escapeHtml(stageEnd)}</p><p><strong>${escapeHtml(stagePoste) || "Poste recherché"}</strong></p></div>`;
        if(skills.length) {
            html += `<div class="cv-section-title">${t.comp}</div><div class="cv-skills">`;
            skills.forEach(s => html += `<span class="cv-skill">${escapeHtml(s)}</span>`);
            html += `</div>`;
        }
        if(experiences.length) {
            html += `<div class="cv-section-title">${t.exp}</div>`;
            experiences.forEach(exp => {
                html += `<div class="cv-job"><div class="cv-job-title"><span>${escapeHtml(exp.title)} - ${escapeHtml(exp.company)}</span><span class="cv-job-date">${escapeHtml(exp.period)}</span></div>`;
                if(exp.desc) html += `<div class="cv-job-desc">${escapeHtml(exp.desc)}</div>`;
                html += `</div>`;
            });
        }
        if(educations.length) {
            html += `<div class="cv-section-title">${t.edu}</div>`;
            educations.forEach(edu => {
                html += `<div class="cv-edu"><div class="cv-edu-title"><span>${escapeHtml(edu.degree)}</span><span class="cv-edu-date">${escapeHtml(edu.year)}</span></div>`;
                if(edu.institution) html += `<div class="cv-edu-place">${escapeHtml(edu.institution)}</div>`;
                if(edu.desc) html += `<div class="cv-edu-desc">${escapeHtml(edu.desc)}</div>`;
                html += `</div>`;
            });
        }
        html += `</div></div>`;
        document.getElementById('cvPreview').innerHTML = html;
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    function renderExpForm() {
        const container = document.getElementById('expList');
        container.innerHTML = '';
        experiences.forEach((exp, idx) => {
            const div = document.createElement('div');
            div.className = 'array-item';
            div.innerHTML = `<button class="remove-item" data-type="exp" data-idx="${idx}">🗑️</button>
                <div class="form-group"><label>Titre</label><input class="exp-title" value="${escapeHtml(exp.title)}" data-idx="${idx}" data-field="title" placeholder="Ex: Chef de projet"></div>
                <div class="form-group"><label>Entreprise</label><input class="exp-company" value="${escapeHtml(exp.company)}" data-idx="${idx}" data-field="company" placeholder="Nom de l'entreprise"></div>
                <div class="form-group"><label>Période</label><input class="exp-period" value="${escapeHtml(exp.period)}" data-idx="${idx}" data-field="period" placeholder="2022 – 2024"></div>
                <div class="form-group"><label>Description</label><textarea class="exp-desc" data-idx="${idx}" data-field="desc" rows="2" placeholder="Décrivez vos missions...">${escapeHtml(exp.desc)}</textarea></div>`;
            container.appendChild(div);
        });
        attachExpEvents();
    }
    function attachExpEvents() {
        document.querySelectorAll('.exp-title, .exp-company, .exp-period, .exp-desc').forEach(el => {
            el.addEventListener('input', (e) => {
                let idx = parseInt(e.target.dataset.idx);
                let field = e.target.dataset.field;
                if(experiences[idx]) experiences[idx][field] = e.target.value;
                renderPreview();
            });
        });
        document.querySelectorAll('.remove-item[data-type="exp"]').forEach(btn => {
            btn.addEventListener('click', () => {
                let idx = parseInt(btn.dataset.idx);
                experiences.splice(idx,1);
                renderExpForm();
                renderPreview();
            });
        });
    }
    function renderEduForm() {
        const container = document.getElementById('eduList');
        container.innerHTML = '';
        educations.forEach((edu, idx) => {
            const div = document.createElement('div');
            div.className = 'array-item';
            div.innerHTML = `<button class="remove-item" data-type="edu" data-idx="${idx}">🗑️</button>
                <div class="form-group"><label>Diplôme</label><input class="edu-degree" value="${escapeHtml(edu.degree)}" data-idx="${idx}" data-field="degree" placeholder="Master, Licence..."></div>
                <div class="form-group"><label>Établissement</label><input class="edu-institution" value="${escapeHtml(edu.institution)}" data-idx="${idx}" data-field="institution" placeholder="Université, école"></div>
                <div class="form-group"><label>Année</label><input class="edu-year" value="${escapeHtml(edu.year)}" data-idx="${idx}" data-field="year" placeholder="2023"></div>
                <div class="form-group"><label>Description</label><textarea class="edu-desc" data-idx="${idx}" data-field="desc" rows="1" placeholder="Description">${escapeHtml(edu.desc || '')}</textarea></div>`;
            container.appendChild(div);
        });
        attachEduEvents();
    }
    function attachEduEvents() {
        document.querySelectorAll('.edu-degree, .edu-institution, .edu-year, .edu-desc').forEach(el => {
            el.addEventListener('input', (e) => {
                let idx = parseInt(e.target.dataset.idx);
                let field = e.target.dataset.field;
                if(educations[idx]) educations[idx][field] = e.target.value;
                renderPreview();
            });
        });
        document.querySelectorAll('.remove-item[data-type="edu"]').forEach(btn => {
            btn.addEventListener('click', () => {
                let idx = parseInt(btn.dataset.idx);
                educations.splice(idx,1);
                renderEduForm();
                renderPreview();
            });
        });
    }

    function addExperience() { experiences.push({title:"", company:"", period:"", desc:""}); renderExpForm(); renderPreview(); }
    function addEducation() { educations.push({degree:"", institution:"", year:"", desc:""}); renderEduForm(); renderPreview(); }

    function bindInputs() {
        const ids = ['fullname','phone','email','address','license','website','hideWebsite','languages','hobbies','stageTitle','stageStart','stageEnd','stagePoste','skills'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('input', renderPreview);
            if(el && el.type === 'checkbox') el.addEventListener('change', renderPreview);
        });
    }

    document.getElementById('photoUpload').addEventListener('change', e => {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = ev => { photoBase64 = ev.target.result; renderPreview(); };
            reader.readAsDataURL(e.target.files[0]);
        }
    });
    document.getElementById('addExpBtn').addEventListener('click', addExperience);
    document.getElementById('addEduBtn').addEventListener('click', addEducation);

    function saveProject() {
        const projectData = {
            fullname: document.getElementById('fullname').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            license: document.getElementById('license').value,
            website: document.getElementById('website').value,
            hideWebsite: document.getElementById('hideWebsite').checked,
            languages: document.getElementById('languages').value,
            hobbies: document.getElementById('hobbies').value,
            stageTitle: document.getElementById('stageTitle').value,
            stageStart: document.getElementById('stageStart').value,
            stageEnd: document.getElementById('stageEnd').value,
            stagePoste: document.getElementById('stagePoste').value,
            skills: document.getElementById('skills').value,
            experiences: experiences,
            educations: educations,
            photoBase64: photoBase64
        };
        const dataStr = JSON.stringify(projectData, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cv_project.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function loadProject() {
        document.getElementById('loadFileInput').click();
    }

    document.getElementById('loadFileInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                document.getElementById('fullname').value = data.fullname || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('license').value = data.license || '';
                document.getElementById('website').value = data.website || '';
                document.getElementById('hideWebsite').checked = data.hideWebsite || false;
                document.getElementById('languages').value = data.languages || '';
                document.getElementById('hobbies').value = data.hobbies || '';
                document.getElementById('stageTitle').value = data.stageTitle || '';
                document.getElementById('stageStart').value = data.stageStart || '';
                document.getElementById('stageEnd').value = data.stageEnd || '';
                document.getElementById('stagePoste').value = data.stagePoste || '';
                document.getElementById('skills').value = data.skills || '';
                experiences = data.experiences || [];
                educations = data.educations || [];
                photoBase64 = data.photoBase64 || '';
                renderExpForm();
                renderEduForm();
                renderPreview();
                alert('Projet chargé avec succès !');
            } catch(err) { alert('Erreur lors du chargement: '+err); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
    document.getElementById('loadProjectBtn').addEventListener('click', loadProject);

    function handlePDFAction() {

        if (action === 'preview') {

        } else {
            saveAsPDF();
        }
    }

    document.getElementById('printPDFBtn').addEventListener('click', handlePDFAction);

    function setLanguage(lang) {
        currentLang = lang;
        updateUILabels();
        renderPreview();
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if(btn.dataset.lang === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
